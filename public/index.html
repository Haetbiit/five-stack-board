}

/* ---------- Fearless view ---------- */
function viewFearless() {
  const s = series();
  const canEdit = !S.readOnly;
  const top = `<div class="toolbar"><div><h2>Fearless draft</h2><p>In a fearless series every champion can only be played once. Lock the picks from each game to see which comfort picks are still open for the next one.</p></div>${canEdit ? `<div class="actions"><button class="btn" data-act="fl-reset" type="button"${s.locked.length ? "" : " disabled"}>Reset series</button></div>` : ""}</div>`;
  const sw = `<button class="switch" type="button" role="switch" aria-checked="${s.enabled}" data-act="fl-toggle"${canEdit ? "" : " disabled"}><span class="knob"></span><span class="sw-text">Fearless draft ${s.enabled ? "on" : "off"}</span></button>`;
  const games = `<div class="seg" role="group" aria-label="Game being drafted">${[1, 2, 3].map(g => `<button type="button" data-act="fl-game" data-val="${g}" aria-pressed="${s.game === g}"${canEdit && s.enabled ? "" : " disabled"}>Game ${g}</button>`).join("")}</div>`;
  const pools = ROLES.map(r => {
    const entries = [];
    S.players.forEach(p => (p.champions || []).forEach(c => { if (c.role === r.k && c.tier !== "learning" && champName(c.champ)) entries.push({ p, c }); }));
    const order = { main: 0, comfort: 1, pocket: 2 };
    entries.sort((a, b) => (a.p.sub ? 1 : 0) - (b.p.sub ? 1 : 0) || (order[a.c.tier] ?? 1) - (order[b.c.tier] ?? 1));
    const left = entries.filter(e => !lockedEntry(e.c.champ)).length;
    const byPlayer = new Map(); entries.forEach(e => { if (!byPlayer.has(e.p.id)) byPlayer.set(e.p.id, { p: e.p, cs: [] }); byPlayer.get(e.p.id).cs.push(e.c); });
    const chip = (c) => { const lk = lockedEntry(c.champ); const tag = canEdit && s.enabled ? "button" : "span"; return `<${tag} class="chip ${esc(c.tier)}${lk ? " locked" : ""}"${tag === "button" ? ` type="button" data-act="fl-lock" data-champ="${esc(champName(c.champ))}" aria-pressed="${!!lk}"` : ""} title="${lk ? `Used in game ${lk.game}${tag === "button" ? ". Tap to unlock." : ""}` : tag === "button" ? `Tap to lock for game ${s.game}` : esc(TIER[c.tier]?.name || "")}">${champIcon(c.champ)}${esc(champName(c.champ))}${lk ? `<small>G${lk.game}</small>` : ""}</${tag}>`; };
    return `<section class="fl-col${s.enabled && entries.length && !left ? " dry" : ""}"><header><span class="role">${ri(r.k)}${r.code}</span><span class="fl-left ${!s.enabled ? "" : left === 0 ? "bad" : left <= 2 ? "warn" : "good"}">${s.enabled ? `${left} of ${entries.length} open` : `${entries.length} picks`}</span></header>
      ${byPlayer.size ? [...byPlayer.values()].map(({ p, cs }) => `<div class="fl-player"><span class="label">${esc(p.name)}${p.sub ? " · Sub" : ""}</span><div class="chips">${cs.map(chip).join("")}</div></div>`).join("") : `<span class="formhint">No comfort picks for ${esc(r.name)} yet.</span>`}</section>`;
  }).join("");
  const byGame = [1, 2, 3].map(g => ({ g, xs: s.locked.filter(l => l.game === g) })).filter(x => x.xs.length);
  const lockedPanel = `<section class="panel"><h3>Locked this series</h3>
    ${byGame.length ? byGame.map(({ g, xs }) => `<div class="fl-game"><span class="label">Game ${g}</span><div class="chips">${xs.map(l => `<span class="chip locked-list ${l.side === "them" ? "them" : ""}">${champIcon(l.champ)}${esc(champName(l.champ))}<small>${l.side === "them" ? "THEM" : "US"}</small>${canEdit ? `<button class="x" type="button" data-act="fl-unlock" data-champ="${esc(champName(l.champ))}" aria-label="Unlock ${esc(champName(l.champ))}">${I.x}</button>` : ""}</span>`).join("")}</div></div>`).join("") : `<span class="formhint">Nothing locked yet. ${s.enabled ? `Tap champions above as they're picked in game ${s.game}.` : "Turn on fearless draft to start a series."}</span>`}
    ${canEdit && s.enabled ? `<form class="fl-add" id="flAdd"><input id="flChamp" name="flchamp" list="champList" placeholder="Lock any champion, e.g. an enemy pick" autocomplete="off" aria-label="Champion to lock"><select id="flSide" name="flside" aria-label="Who picked it">${opt("them", "Their pick", true)}${opt("us", "Our pick", false)}</select><button class="btn" type="submit">${I.lock}Lock for game ${s.game}</button></form>` : ""}</section>`;
  if (!S.players.length) return top + `<div class="empty"><span class="ico">${I.lock}</span><h3>No champion pools yet</h3><p>Add players and their comfort champions on the Roster tab. They'll appear here sorted by position.</p></div>`;
  return top + `<div class="fl-bar">${sw}${games}<span class="formhint">${s.enabled ? `Now drafting <b>game ${s.game}</b>. ${canEdit ? "Tap a champion to lock it; tap again to unlock." : ""}` : "Locked champions are only greyed out while fearless draft is on."}</span></div>
    <div class="fl-grid${s.enabled ? "" : " off"}">${pools}</div>` + lockedPanel;
}

/* ---------- Scouting view ---------- */
function viewScouting() {
  const v = scoutValues(), saved = scoutSaved();
  const dirty = !!S.scoutDraft && SCOUT_FIELDS.some(k => (S.scoutDraft[k] ?? (saved[k] || "")) !== (saved[k] || ""));
  const ro = S.readOnly;
  const next = upcomingScrims()[0];
  const top = `<div class="toolbar"><div><h2>Opponent scouting</h2><p>Notes on the next team you play: what they're best at, where they're weak, and how we plan to win.</p></div></div>`;
  const nextCard = next && next.opponent !== v.opponent ? `<div class="banner"><span>${I.cal}<span>Next scrim: <b>${esc(next.opponent)}</b> on ${esc(fmtDate(parseYmd(next.date), { weekday: "short", day: "numeric", month: "short" }))}${next.time ? ", " + esc(next.time) : ""}</span></span>${ro ? "" : `<button class="btn small" type="button" data-act="scout-use-next">Scout this team</button>`}</div>` : "";
  const area = (k, title, hint, ph) => `<section class="panel scout-box"><h3>${title}</h3><p class="hint">${hint}</p>${ro ? `<p class="scout-text${v[k] ? "" : " na"}">${esc(v[k] || "Nothing written yet.")}</p>` : `<textarea id="sc_${k}" data-scout="${k}" rows="7" placeholder="${esc(ph)}" aria-label="${esc(title)}">${esc(v[k])}</textarea>`}</section>`;
  const champs = mentionedChamps(v.powerPicks);
  const savedAt = saved.updatedAt ? new Date(saved.updatedAt) : null;
  const status = dirty ? `<span class="unsaved">Unsaved changes</span>` : `<span class="formhint">${savedAt ? "Saved " + esc(savedAt.toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" })) : "Not saved yet"}</span>`;
  return top + nextCard + `<section class="panel scout-head">
      ${ro ? `<div class="scout-opp"><span class="label">Next opponent</span><b>${esc(v.opponent || "Not set")}</b>${v.matchDate ? `<span>${esc(fmtDate(parseYmd(v.matchDate), { weekday: "long", day: "numeric", month: "long" }))}</span>` : ""}</div>`
        : `<div class="frow"><label class="f"><span>Next opponent</span><input id="sc_opponent" data-scout="opponent" value="${esc(v.opponent)}" placeholder="Team name"></label><label class="f"><span>Match date</span><input id="sc_matchDate" data-scout="matchDate" type="date" value="${esc(v.matchDate)}"></label></div>`}
      ${champs.length ? `<div class="scout-champs"><span class="label">Their power picks</span><div class="chips">${champs.map(c => `<span class="chip">${champIcon(c)}${esc(c)}</span>`).join("")}</div></div>` : ""}
    </section>
    <div class="scout-grid">
      ${area("powerPicks", "Power picks & bans", "Their best champions and what we should ban.", "e.g. Azir mid is their comfort pick. Ban Azir, Lee Sin")}
      ${area("weaknesses", "Weaknesses", "Where they're vulnerable: lanes, timings, habits.", "e.g. Bot lane overextends without vision")}
      ${area("gameplan", "Our gameplan", "How we play this match.", "e.g. Play for early dragons, group after first tower")}
    </div>
    ${ro ? "" : `<div class="savebar">${status}<div class="right">${dirty ? `<button class="btn" type="button" data-act="scout-discard">Discard</button>` : ""}<button class="btn primary" type="button" data-act="scout-save"${dirty ? "" : " disabled"}>${I.check}Save notes</button></div></div>`}`;
}
async function saveScouting() {
  if (!S.scoutDraft) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const data = scoutValues(); data.opponent = data.opponent.trim();
  const ok = await writeDoc("scouting", "next", data);
  if (ok) { S.scoutDraft = null; render(); toast("Scouting notes saved"); }
}

/* ---------- Editors ---------- */
const overlay = document.getElementById("overlay");
let lastFocus = null;
function openSheet(title, bodyHtml, { onSubmit, onDelete, deleteLabel }) {
  lastFocus = document.activeElement;
  overlay.innerHTML = `<div class="scrim" data-act="close-scrim"><form class="sheet" id="sheetForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <div class="sheet-head"><h2 id="sheetTitle">${esc(title)}</h2><button class="iconbtn" type="button" data-act="close" aria-label="Close">${I.x}</button></div>
    <div class="sheet-body">${bodyHtml}</div>
    <div class="sheet-foot">${onDelete ? `<div class="confirm" id="delWrap"><button class="btn danger" type="button" id="delBtn">${I.trash}${esc(deleteLabel || "Delete")}</button></div>` : ""}
      <div class="right"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit" id="saveBtn">Save</button></div></div>
  </form></div>`;
  document.documentElement.classList.add("locked");
  const form = document.getElementById("sheetForm");
  form.addEventListener("submit", async (e) => { e.preventDefault(); const b = document.getElementById("saveBtn"); b.disabled = true; b.textContent = "Saving…"; const ok = await onSubmit(form); if (ok !== false) closeSheet(); else { b.disabled = false; b.textContent = "Save"; } });
  if (onDelete) {
    document.getElementById("delBtn").addEventListener("click", () => {
      const w = document.getElementById("delWrap");
      w.innerHTML = `<span>Delete for everyone?</span><button class="btn danger small" type="button" id="delYes">Yes, delete</button><button class="btn small" type="button" id="delNo">Keep</button>`;
      document.getElementById("delYes").addEventListener("click", async () => { if (await onDelete()) closeSheet(); });
      document.getElementById("delNo").addEventListener("click", () => { w.innerHTML = `<button class="btn danger" type="button" id="delBtn">${I.trash}${esc(deleteLabel || "Delete")}</button>`; openSheetDeleteRebind(onDelete, deleteLabel); });
    });
  }
  const first = form.querySelector("input, select, textarea"); if (first) first.focus();
}
function openSheetDeleteRebind(onDelete, label) {
  document.getElementById("delBtn").addEventListener("click", () => {
    const w = document.getElementById("delWrap");
    w.innerHTML = `<span>Delete for everyone?</span><button class="btn danger small" type="button" id="delYes">Yes, delete</button><button class="btn small" type="button" id="delNo">Keep</button>`;
    document.getElementById("delYes").addEventListener("click", async () => { if (await onDelete()) closeSheet(); });
    document.getElementById("delNo").addEventListener("click", () => { w.innerHTML = `<button class="btn danger" type="button" id="delBtn">${I.trash}${esc(label || "Delete")}</button>`; openSheetDeleteRebind(onDelete, label); });
  });
}
function closeSheet() { overlay.innerHTML = ""; document.documentElement.classList.remove("locked"); if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {} }
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && overlay.innerHTML) closeSheet(); });

function opt(v, label, sel) { return `<option value="${esc(v)}"${sel ? " selected" : ""}>${esc(label)}</option>`; }

function champRow(c = {}) {
  return `<div class="crow">
    <input name="cChamp" list="champList" placeholder="Champion" value="${esc(c.champ || "")}" aria-label="Champion" autocomplete="off">
    <select name="cRole" aria-label="Role">${ROLES.map(r => opt(r.k, r.code, c.role === r.k)).join("")}</select>
    <select name="cTier" aria-label="Comfort level">${TIERS.map(t => opt(t.k, t.name, (c.tier || "comfort") === t.k)).join("")}</select>
    <button class="iconbtn" type="button" data-act="rm-row" aria-label="Remove champion">${I.x}</button></div>`;
}

function editPlayer(id) {
  const p = id ? playerById(id) : null;
  const d = p || { primaryRole: (ROLES.find(r => !S.players.some(x => x.primaryRole === r.k)) || ROLES[0]).k, secondaryRoles: [], champions: [], strengths: [], weaknesses: [], rank: "", div: "" };
  const body = `
  <fieldset><legend>Player</legend>
    <div class="frow"><label class="f"><span>Name</span><input id="pName" name="name" required value="${esc(d.name || "")}" placeholder="What the team calls them"></label>
    <label class="f"><span>Riot ID</span><input id="pIgn" name="ign" value="${esc(d.ign || "")}" placeholder="Name#TAG"></label></div>
    <div class="frow"><label class="f"><span>Rank</span><select id="pRank" name="rank">${opt("", "—", !d.rank)}${RANKS.map(r => opt(r, r, d.rank === r)).join("")}</select></label>
    <label class="f"><span>Division</span><select id="pDiv" name="div">${opt("", "—", !d.div)}${DIVS.map(x => opt(x, x, d.div === x)).join("")}</select></label>
    <label class="f"><span>Playstyle</span><select id="pStyle" name="style">${opt("", "—", !d.style)}${STYLES.map(s => opt(s, s, d.style === s)).join("")}</select></label>
    <label class="f"><span>Roster spot</span><select id="pSpot" name="spot">${opt("starter", "Starter", !d.sub)}${opt("sub", "Substitute", !!d.sub)}</select></label></div>
  </fieldset>
  <fieldset><legend>Roles</legend>
    <label class="f"><span>Main role</span><select id="pRole" name="primaryRole">${ROLES.map(r => opt(r.k, r.name, d.primaryRole === r.k)).join("")}</select></label>
    <div class="f"><span>Can also play</span><div class="checks">${ROLES.map(r => `<label><input type="checkbox" name="sec" value="${r.k}"${(d.secondaryRoles || []).includes(r.k) ? " checked" : ""}>${ri(r.k)}${r.code}</label>`).join("")}</div></div>
  </fieldset>
  <fieldset><legend>Champion pool</legend>
    <p class="formhint">Main = ready for scrims. Comfort = solid. Pocket = situational counterpick. Learning = not draft-ready.</p>
    <div class="crows" id="crows">${(d.champions || []).map(champRow).join("")}</div>
    <div><button class="btn small" type="button" data-act="add-row">${I.plus}Add champion</button></div>
  </fieldset>
  <fieldset><legend>Strengths</legend>
    <label class="f"><span>One per line</span><textarea id="pStr" name="strengths" rows="3">${esc((d.strengths || []).join("\n"))}</textarea></label>
    <div class="quick">${STRENGTH_TAGS.map(t => `<button class="chip" type="button" data-act="quick" data-target="pStr" data-val="${esc(t)}">+ ${esc(t)}</button>`).join("")}</div>
  </fieldset>
  <fieldset><legend>Weaknesses</legend>
    <label class="f"><span>One per line</span><textarea id="pWeak" name="weaknesses" rows="3">${esc((d.weaknesses || []).join("\n"))}</textarea></label>
    <div class="quick">${WEAK_TAGS.map(t => `<button class="chip" type="button" data-act="quick" data-target="pWeak" data-val="${esc(t)}">+ ${esc(t)}</button>`).join("")}</div>
  </fieldset>
  <fieldset><legend>Notes</legend><label class="f"><span>Anything the team should know</span><textarea id="pNotes" name="notes" rows="3" placeholder="e.g. Plays better with early jungle attention">${esc(d.notes || "")}</textarea></label></fieldset>`;
  openSheet(p ? `Edit ${p.name}` : "Add teammate", body, {
    onSubmit: async (f) => {
      const name = f.name.value.trim();
      if (!name) { toast("Give the player a name before saving."); f.name.focus(); return false; }
      const champs = [];
      f.querySelectorAll(".crow").forEach(row => { const champ = champName(row.querySelector('[name="cChamp"]').value); if (champ) champs.push({ champ, role: row.querySelector('[name="cRole"]').value, tier: row.querySelector('[name="cTier"]').value }); });
      const data = { name, ign: f.ign.value.trim(), rank: f.rank.value, div: f.div.value, style: f.style.value, sub: f.spot.value === "sub", primaryRole: f.primaryRole.value,
        secondaryRoles: [...f.querySelectorAll('[name="sec"]:checked')].map(x => x.value).filter(k => k !== f.primaryRole.value),
        champions: champs, strengths: lines(f.strengths.value), weaknesses: lines(f.weaknesses.value), notes: f.notes.value.trim() };
      if (p && p.example) data.example = true;
      const ok = await writeDoc("players", p ? p.id : uid("p-"), data);
      if (ok) toast(p ? "Player saved" : `${name} added`);
      return ok;
    },
    onDelete: p ? async () => { const ok = await deleteDoc("players", p.id); if (ok) toast(`${p.name} removed`); return ok; } : null,
    deleteLabel: "Remove player",
  });
  if (!p) { const rows = document.getElementById("crows"); rows.insertAdjacentHTML("beforeend", champRow({ role: d.primaryRole, tier: "main" })); }
}

function sugChips(playerId, role) {
  const p = playerId ? playerById(playerId) : null;
  if (!p) return "";
  let cs = (p.champions || []).filter(c => c.role === role);
  if (!cs.length) cs = p.champions || [];
  const order = { main: 0, comfort: 1, pocket: 2, learning: 3 };
  cs = [...cs].sort((a, b) => (order[a.tier] ?? 1) - (order[b.tier] ?? 1));
  return cs.slice(0, 8).map(c => `<button class="chip ${esc(c.tier)}" type="button" data-act="pick-sug" data-val="${esc(champName(c.champ))}">${champIcon(c.champ)}${esc(champName(c.champ))}</button>`).join("");
}

function editComp(id) {
  const c = id ? S.comps.find(x => x.id === id) : null;
  const d = c || { picks: {}, archetype: "engage" };
  const ps = sortedPlayers();
  const rows = ROLES.map(r => {
    const pk = (d.picks || {})[r.k] || {};
    let pid = pk.playerId;
    if (!c && !pid) { const m = ps.find(p => p.primaryRole === r.k); if (m) pid = m.id; }
    return `<div class="prow-wrap" data-role="${r.k}"><div class="prow"><span class="role big">${ri(r.k)}${r.code}</span>
      <select name="pl_${r.k}" aria-label="${r.name} player">${opt("", "No player", !pid)}${ps.map(p => opt(p.id, p.name + (p.primaryRole === r.k ? "" : ` (${ROLE[p.primaryRole]?.code || "?"})`), pid === p.id)).join("")}</select>
      <input name="ch_${r.k}" list="champList" placeholder="Champion" value="${esc(pk.champ || "")}" aria-label="${r.name} champion" autocomplete="off"></div>
      <div class="prow"><span></span><div class="sugs">${sugChips(pid, r.k)}</div></div></div>`;
  }).join("");
  const body = `
  <fieldset><legend>Comp</legend>
    <div class="frow"><label class="f"><span>Name</span><input id="cName" name="cname" value="${esc(d.name || "")}" placeholder="e.g. Dive bot"></label>
    <label class="f"><span>Archetype</span><select id="cArch" name="archetype">${ARCHETYPES.map(a => opt(a.k, a.name, d.archetype === a.k)).join("")}</select></label></div>
    <p class="formhint" id="archHint">${esc(ARCH[d.archetype]?.hint || "")}</p>
  </fieldset>
  <fieldset><legend>Picks</legend><p class="formhint">Tap a champion from the player's pool, or type any champion.</p>${rows}</fieldset>
  <fieldset><legend>Game plan</legend>
    <label class="f"><span>Win condition</span><textarea id="cWin" name="win" rows="2" placeholder="How does this comp win games?">${esc(d.winCondition || "")}</textarea></label>
    <label class="f"><span>Weak against</span><textarea id="cWeak" name="weak" rows="2" placeholder="Comps or champions that shut it down">${esc(d.weakAgainst || "")}</textarea></label>
    <label class="f"><span>Target bans</span><input id="cBans" name="bans" value="${esc(d.bans || "")}" placeholder="Comma-separated"></label>
    <label class="f"><span>Notes</span><textarea id="cNotes" name="cnotes" rows="2">${esc(d.notes || "")}</textarea></label>
  </fieldset>`;
  openSheet(c ? `Edit ${c.name || "comp"}` : "New comp", body, {
    onSubmit: async (f) => {
      const picks = {};
      ROLES.forEach(r => { picks[r.k] = { champ: champName(f["ch_" + r.k].value), playerId: f["pl_" + r.k].value }; });
      const data = { name: f.cname.value.trim() || "Untitled comp", archetype: f.archetype.value, picks, winCondition: f.win.value.trim(), weakAgainst: f.weak.value.trim(), bans: f.bans.value.trim(), notes: f.cnotes.value.trim() };
      if (c && c.example) data.example = true;
      const ok = await writeDoc("comps", c ? c.id : uid("c-"), data);
      if (ok) toast("Comp saved");
      return ok;
    },
    onDelete: c ? async () => { const ok = await deleteDoc("comps", c.id); if (ok) toast("Comp deleted"); return ok; } : null,
    deleteLabel: "Delete comp",
  });
  const form = document.getElementById("sheetForm");
  form.archetype.addEventListener("change", () => { document.getElementById("archHint").textContent = ARCH[form.archetype.value]?.hint || ""; });
  ROLES.forEach(r => form["pl_" + r.k].addEventListener("change", (e) => { e.target.closest(".prow-wrap").querySelector(".sugs").innerHTML = sugChips(e.target.value, r.k); }));
}

function renameTeam() {
  openSheet("Rename team", `<label class="f"><span>Team name</span><input id="tName" name="tname" value="${esc(S.meta.teamName || "")}" placeholder="Our Team" maxlength="40"></label>`, {
    onSubmit: async (f) => { const ok = await saveMeta({ teamName: f.tname.value.trim() || "Our Team" }); if (ok !== false) toast("Team renamed"); return ok !== false; },
  });
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "close-scrim") { if (e.target === t) closeSheet(); return; }
  if (act === "close") return closeSheet();
  if (act === "add-player") return editPlayer(null);
  if (act === "edit-player") return editPlayer(t.dataset.id);
  if (act === "add-comp") return editComp(null);
  if (act === "edit-comp") return editComp(t.dataset.id);
  if (act === "unlock") return openCodeSheet();
  if (act === "week") { S.weekOffset = t.dataset.val === "0" ? 0 : S.weekOffset + Number(t.dataset.val); render(); return; }
  if (act === "avail") {
    if (S.readOnly) { toast("Unlock editing to mark availability."); return; }
    const pid = t.dataset.pid, date = t.dataset.date, cur = availOf(pid, date);
    const nextSt = cur === "" ? "yes" : cur === "yes" ? "no" : "";
    const id = availId(date, pid);
    if (nextSt) writeDoc("avail", id, { date, playerId: pid, status: nextSt }); else deleteDoc("avail", id);
    return;
  }
  if (act === "add-scrim") return editScrim(null, t.dataset.date);
  if (act === "edit-scrim") return editScrim(t.dataset.id);
  if (act === "fl-toggle") { const sr = series(); saveSeries({ enabled: !sr.enabled }); toast(sr.enabled ? "Fearless draft off" : `Fearless draft on, game ${sr.game}`); return; }
  if (act === "fl-game") { saveSeries({ game: Number(t.dataset.val) }); return; }
  if (act === "fl-lock" || act === "fl-unlock") {
    const sr = series(), n = t.dataset.champ.toLowerCase();
    const has = sr.locked.find(l => champName(l.champ).toLowerCase() === n);
    if (act === "fl-unlock" && !has) return;
    saveSeries({ locked: has ? sr.locked.filter(l => l !== has) : [...sr.locked, { champ: t.dataset.champ, game: sr.game, side: "us" }] });
    return;
  }
  if (act === "fl-reset") {
    if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.classList.add("danger"); t.textContent = "Click again to reset"; setTimeout(() => { if (t.isConnected) { t.dataset.confirm = ""; t.classList.remove("danger"); t.textContent = "Reset series"; } }, 4000); return; }
    saveSeries({ locked: [], game: 1 }).then(ok => { if (ok) toast("Series reset to game 1"); });
    return;
  }
  if (act === "scout-save") return saveScouting();
  if (act === "scout-discard") { S.scoutDraft = null; render(); return; }
  if (act === "scout-use-next") { const nx = upcomingScrims()[0]; if (nx) { S.scoutDraft = { ...(S.scoutDraft || {}), opponent: nx.opponent, matchDate: nx.date }; render(); } return; }
  if (act === "filter") { S.roleFilter = t.dataset.val; render(); return; }
  if (act === "load-ex") return loadExamples();
  if (act === "clear-ex") return clearExamples();
  if (act === "add-row") { const rows = document.getElementById("crows"); const role = document.getElementById("pRole").value; rows.insertAdjacentHTML("beforeend", champRow({ role, tier: "comfort" })); rows.lastElementChild.querySelector("input").focus(); return; }
  if (act === "rm-row") { t.closest(".crow").remove(); return; }
  if (act === "quick") { const ta = document.getElementById(t.dataset.target); const cur = lines(ta.value); if (!cur.some(x => x.toLowerCase() === t.dataset.val.toLowerCase())) { cur.push(t.dataset.val); ta.value = cur.join("\n"); } return; }
  if (act === "pick-sug") { const wrap = t.closest(".prow-wrap"); wrap.querySelector("input").value = t.dataset.val; return; }
});
document.getElementById("renameBtn").addEventListener("click", renameTeam);
document.addEventListener("submit", (e) => {
  if (e.target.id !== "flAdd") return;
  e.preventDefault();
  const inp = e.target.flchamp, info = champInfo(inp.value);
  if (!info) { toast("Pick a champion from the list."); inp.focus(); return; }
  const sr = series();
  if (lockedEntry(info.name)) { toast(`${info.name} is already locked.`); return; }
  inp.value = ""; inp.blur();
  saveSeries({ locked: [...sr.locked, { champ: info.name, game: sr.game, side: e.target.flside.value }] }).then(ok => { if (ok) toast(`${info.name} locked for game ${sr.game}`); });
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset && e.target.dataset.scout;
  if (!k) return;
  S.scoutDraft = { ...(S.scoutDraft || {}), [k]: e.target.value };
  const sb = document.querySelector(".savebar");
  if (sb) {
    sb.querySelector('[data-act="scout-save"]').disabled = false;
    const st = sb.firstElementChild; if (st && !st.classList.contains("unsaved")) st.outerHTML = `<span class="unsaved">Unsaved changes</span>`;
    if (!sb.querySelector('[data-act="scout-discard"]')) sb.querySelector(".right").insertAdjacentHTML("afterbegin", `<button class="btn" type="button" data-act="scout-discard">Discard</button>`);
  }
});
document.getElementById("view").addEventListener("focusout", () => setTimeout(() => { if (S.pendingRender) render(); }, 0));
document.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s" && S.view === "scouting" && !S.readOnly && !overlay.innerHTML) { e.preventDefault(); saveScouting(); } });
window.addEventListener("beforeunload", (e) => { if (S.scoutDraft && document.querySelector(".unsaved")) { e.preventDefault(); e.returnValue = ""; } });
document.getElementById("codeBtn").addEventListener("click", () => {
  if (S.readOnly) return openCodeSheet();
  setCode(""); S.readOnly = true; render(); toast("Editing locked on this device");
});

function route() { const h = (location.hash || "").slice(1); S.view = VIEWS.includes(h) ? h : "roster"; render(); const a = document.querySelector(`.tabs a[data-view="${S.view}"]`); if (a && a.scrollIntoView) a.scrollIntoView({ block: "nearest", inline: "nearest" }); }
window.addEventListener("hashchange", route);
route();

/* ---------- Champion icons (published alongside the page) ---------- */
fetch("champ-icons.json").then(r => r.ok ? r.json() : null).then(j => { if (j && typeof j === "object") { ICONS = {}; for (const k in j) if (typeof j[k] === "string" && j[k].startsWith("data:image/")) ICONS[k.toLowerCase()] = j[k]; render(); } }).catch(() => {});

/* ---------- Boot ---------- */
(async function boot() {
  const c = window.claude;
  if (c && typeof c.use === "function") { try { db = await c.use("db"); } catch (e) { db = null; } }
  if (!db) {
    // Hosted on Vercel: use the board API when it answers with JSON
    try { const r = await fetch(API + "?since=-1", { cache: "no-store" }); if (r.status !== 404 && (r.headers.get("content-type") || "").includes("json")) { startApi(); return; } } catch (e) {}
    startLocal(); return;
  }
  startDb();
  try { const u = await c.use("user"); if (u) { const w = await u.can("data.write"); if (w === false) { S.readOnly = true; render(); } } } catch (e) {}
})();
})();
</script>
</body>
</html>
