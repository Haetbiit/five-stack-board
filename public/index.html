<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16171a">
<meta name="description" content="Roster, champion pools, scrim schedule, fearless draft and scouting for a League of Legends five-stack.">
<title>Five-Stack Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='5' fill='%2316171a'/%3E%3Crect x='7' y='15' width='3' height='12' fill='%23eeece7'/%3E%3Crect x='11.5' y='10' width='3' height='17' fill='%23eeece7'/%3E%3Crect x='16' y='6' width='3' height='21' fill='%235b8cff'/%3E%3Crect x='20.5' y='10' width='3' height='17' fill='%23eeece7'/%3E%3Crect x='25' y='15' width='3' height='12' fill='%23eeece7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="3" stroke="currentColor" stroke-width="2"/><rect x="7" y="15" width="3" height="12" fill="currentColor"/><rect x="11.5" y="10" width="3" height="17" fill="currentColor"/><rect x="16" y="6" width="3" height="21" fill="#5b8cff"/><rect x="20.5" y="10" width="3" height="17" fill="currentColor"/><rect x="25" y="15" width="3" height="12" fill="currentColor"/></svg></span>
      <div class="brand-text">
        <span class="kicker" data-i18n="Five-Stack Board">Five-Stack Board</span>
        <h1 class="teamname"><span id="teamName">Our Team</span><button class="iconbtn sm" id="renameBtn" type="button" data-i18n-label="Rename team" aria-label="Rename team" title="Rename team"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></h1>
      </div>
    </div>
    <div class="hdr-right">
      <div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="de" aria-pressed="false">DE</button></div>
      <button class="btn small" id="codeBtn" type="button" hidden></button>
    </div>
  </div>
  <nav class="tabs wrap" aria-label="Views">
    <a href="#roster" data-view="roster"><span data-i18n="Roster">Roster</span><span class="n" id="nPlayers"></span></a>
    <a href="#team" data-view="team"><span data-i18n="Team map">Team map</span></a>
    <a href="#comps" data-view="comps"><span data-i18n="Comps">Comps</span><span class="n" id="nComps"></span></a>
    <a href="#draft" data-view="draft"><span data-i18n="Draft">Draft</span></a>
    <a href="#schedule" data-view="schedule"><span data-i18n="Schedule">Schedule</span><span class="n" id="nScrims"></span></a>
    <a href="#fearless" data-view="fearless"><span data-i18n="Fearless">Fearless</span><span class="n" id="nLocked"></span></a>
    <a href="#scouting" data-view="scouting"><span data-i18n="Scouting">Scouting</span></a>
  </nav>
</header>
<main><div class="wrap" id="view"></div></main>
<datalist id="champList"></datalist>
<div id="overlay"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
