<style>
/* Layout: a sleek team client. Sticky glass header with segmented views, then one working surface: lineup + roster cards, a team map, or draft sheets laid out as five role slots. Dark-first, hextech gold accent. */
:root {
  --bg: #0a0d14;
  --surface: #11161f;
  --surface-2: #171d28;
  --surface-3: #1f2733;
  --line: #222a37;
  --line-strong: #323c4d;
  --fg: #e9edf4;
  --muted: #949db0;
  --faint: #636c7f;
  --accent: #e3bf72;
  --accent-soft: #2a2417;
  --accent-line: #5a4a26;
  --accent-btn: #e3bf72;
  --accent-btn-fg: #1a1406;
  --hex: #5fd3e2;
  --good: #5fd09a; --good-soft: #13291f;
  --warn: #f0b85a; --warn-soft: #2d2412;
  --bad: #f2878b; --bad-soft: #321a1c;
  --ad: #f4915c; --ap: #8f9dff;
  --header: rgba(10, 13, 20, .78);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -12px rgba(0,0,0,.6);
  --shadow-lift: 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -14px rgba(0,0,0,.75);
  --scrim: rgba(3, 5, 9, .62);
  --glow: radial-gradient(1200px 420px at 15% -10%, rgba(227,191,114,.07), transparent 60%), radial-gradient(900px 380px at 95% -5%, rgba(95,211,226,.06), transparent 60%);
  /* Rank crest colours, mid-tone so they read on both themes */
  --rk-iron: #7c7f86; --rk-bronze: #a8714a; --rk-silver: #9aa6b2; --rk-gold: #d8a845; --rk-platinum: #3fb5a8;
  --rk-emerald: #2fbf71; --rk-diamond: #6d8cf0; --rk-master: #b46be0; --rk-grandmaster: #e0525a; --rk-challenger: #f0c95c;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 8px; --r: 12px; --r-lg: 16px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1f6; --surface: #ffffff; --surface-2: #f4f6fa; --surface-3: #e8ecf2; --line: #e0e5ec; --line-strong: #c8d0dc;
    --fg: #101521; --muted: #5a6376; --faint: #8b93a4; --accent: #946812; --accent-soft: #f7efdc; --accent-line: #e0c78f;
    --accent-btn: #d9aa4c; --accent-btn-fg: #1a1406; --hex: #0a8597;
    --good: #1f7a4f; --good-soft: #dff2e8; --warn: #8d5b05; --warn-soft: #f8ecd2; --bad: #b2343a; --bad-soft: #f8e0e0;
    --ad: #c2541f; --ap: #4a5fd0; --header: rgba(255, 255, 255, .82);
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.12);
    --shadow-lift: 0 2px 4px rgba(16,24,40,.06), 0 18px 36px -14px rgba(16,24,40,.22);
    --scrim: rgba(16, 21, 33, .42);
    --glow: radial-gradient(1200px 420px at 15% -10%, rgba(217,170,76,.10), transparent 60%), radial-gradient(900px 380px at 95% -5%, rgba(10,133,151,.07), transparent 60%);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f4f6fa; --surface-3: #e8ecf2; --line: #e0e5ec; --line-strong: #c8d0dc;
  --fg: #101521; --muted: #5a6376; --faint: #8b93a4; --accent: #946812; --accent-soft: #f7efdc; --accent-line: #e0c78f;
  --accent-btn: #d9aa4c; --accent-btn-fg: #1a1406; --hex: #0a8597;
  --good: #1f7a4f; --good-soft: #dff2e8; --warn: #8d5b05; --warn-soft: #f8ecd2; --bad: #b2343a; --bad-soft: #f8e0e0;
  --ad: #c2541f; --ap: #4a5fd0; --header: rgba(255, 255, 255, .82);
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.12);
  --shadow-lift: 0 2px 4px rgba(16,24,40,.06), 0 18px 36px -14px rgba(16,24,40,.22);
  --scrim: rgba(16, 21, 33, .42);
  --glow: radial-gradient(1200px 420px at 15% -10%, rgba(217,170,76,.10), transparent 60%), radial-gradient(900px 380px at 95% -5%, rgba(10,133,151,.07), transparent 60%);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html.locked, html.locked body { overflow: hidden; }
body { background: var(--bg); background-image: var(--glow); background-repeat: no-repeat; color: var(--fg); font-family: var(--font-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; letter-spacing: -.015em; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--hex); outline-offset: 2px; border-radius: 6px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--header); -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px); border-bottom: 1px solid var(--line); }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 11px; background: linear-gradient(145deg, var(--accent-soft), var(--surface-2)); border: 1px solid var(--accent-line); color: var(--accent); }
.mark svg { width: 20px; height: 20px; }
.brand-text { display: grid; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.teamname { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 4px; min-width: 0; }
.teamname #teamName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hdr-right { justify-self: end; display: flex; align-items: center; gap: 8px; min-width: 0; }
.status { justify-self: end; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); padding: 6px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; max-width: 100%; }
.status #statusText { overflow: hidden; text-overflow: ellipsis; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); flex: none; }
.status.local .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.status.ro .dot { background: var(--faint); box-shadow: none; }
@media (prefers-reduced-motion: no-preference) { .status:not(.local):not(.ro) .dot { animation: pulse 2.4s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent; } } }

.tabs { display: inline-flex; gap: 2px; padding: 4px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px; color: var(--muted); text-decoration: none; padding: 7px 14px; border-radius: 9px; white-space: nowrap; transition: color .15s, background .15s; }
.tabs a:hover { color: var(--fg); }
.tabs a[aria-current="page"] { color: var(--fg); background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 0 0 1px var(--line-strong); }
.tabs a .n { font-family: var(--font-mono); font-size: 10.5px; min-width: 18px; padding: 1px 5px; border-radius: 999px; background: var(--surface-3); color: var(--muted); text-align: center; }
.tabs a[aria-current="page"] .n { background: var(--accent-soft); color: var(--accent); }
.tabs a .n:empty { display: none; }

main .wrap { padding-block: 28px 72px; display: grid; gap: 22px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-strong); background: var(--surface-2); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s, filter .15s; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.primary { background: var(--accent-btn); color: var(--accent-btn-fg); border-color: transparent; box-shadow: 0 6px 18px -8px var(--accent-btn); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); background: transparent; border-color: var(--line); }
.btn.danger:hover { background: var(--bad-soft); border-color: transparent; }
.btn.small { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.iconbtn { display: inline-grid; place-items: center; width: 32px; height: 32px; flex: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 9px; transition: background .15s, color .15s; }
.iconbtn:hover { background: var(--surface-3); color: var(--fg); }
.iconbtn.sm { width: 28px; height: 28px; }

.toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.toolbar h2 { font-size: 26px; font-weight: 700; }
.toolbar p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.toolbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }

.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px 10px 16px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: 13.5px; }
.banner > span { display: inline-flex; align-items: center; gap: 10px; }
.banner > span svg { color: var(--accent); }
.banner.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }

/* Filters */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 12.5px; font-weight: 600; transition: all .15s; }
.fchip:hover { color: var(--fg); border-color: var(--line-strong); }
.fchip[aria-pressed="true"] { color: var(--fg); background: var(--surface-3); border-color: var(--line-strong); }
.fchip .ri { width: 14px; height: 14px; }
.fchip .c { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }

/* Role badges and glyphs (alpha masks painted with currentColor) */
.role { justify-self: start; display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-weight: 600; font-size: 10.5px; letter-spacing: .08em; padding: 3px 7px 3px 5px; border-radius: 6px; background: var(--surface-3); color: var(--muted); line-height: 1.2; }
.role.big { width: 44px; height: 44px; padding: 0; justify-content: center; flex-direction: column; gap: 1px; border-radius: 12px; font-size: 9.5px; background: var(--surface-3); color: var(--fg); border: 1px solid var(--line-strong); flex: none; }
.ri { width: 14px; height: 14px; flex: none; display: inline-block; background: currentColor; -webkit-mask: var(--ri) center / contain no-repeat; mask: var(--ri) center / contain no-repeat; }
.role.big .ri { width: 18px; height: 18px; }
th .ri { width: 15px; height: 15px; vertical-align: -3px; margin-right: 5px; }
.checks .ri { width: 15px; height: 15px; }

/* Lineup */
.lineup { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.slot { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; min-width: 0; box-shadow: var(--shadow); }

/* Player cards */

.card-head h3 { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ign { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); font-weight: 500; letter-spacing: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; }

.pill.rank { color: var(--fg); }

.pill.rank[data-rk="iron"] { --rk: var(--rk-iron); } .pill.rank[data-rk="bronze"] { --rk: var(--rk-bronze); }
.pill.rank[data-rk="silver"] { --rk: var(--rk-silver); } .pill.rank[data-rk="gold"] { --rk: var(--rk-gold); }
.pill.rank[data-rk="platinum"] { --rk: var(--rk-platinum); } .pill.rank[data-rk="emerald"] { --rk: var(--rk-emerald); }
.pill.rank[data-rk="diamond"] { --rk: var(--rk-diamond); } .pill.rank[data-rk="master"] { --rk: var(--rk-master); }
.pill.rank[data-rk="grandmaster"] { --rk: var(--rk-grandmaster); } .pill.rank[data-rk="challenger"] { --rk: var(--rk-challenger); }
.tag-ex { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); padding: 1px 6px; border-radius: 5px; }
.label { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }

.chip.comfort { border-color: var(--line-strong); }
.chip.pocket { border-style: dashed; border-color: var(--line-strong); }

.sw .plus li::before { content: "+"; color: var(--good); background: var(--good-soft); }

/* Empty / loading */
.empty { border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg); padding: 44px 24px; text-align: center; display: grid; gap: 10px; justify-items: center; background: var(--surface); }
.empty .ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); margin-bottom: 4px; }

.skel { display: grid; gap: 16px; }

.sk { border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); }

@media (prefers-reduced-motion: no-preference) { .sk { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; } @keyframes shimmer { to { background-position: -200% 0; } } }
.skel-note { color: var(--muted); font-size: 13px; }

/* Team map */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); align-content: start; }

.scroll { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
table.cov { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 580px; font-variant-numeric: tabular-nums; }

.cell { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 7px; }
.cell.main { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); }
.cell.sec { border: 1px solid var(--line-strong); color: var(--fg); }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.tdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; vertical-align: 0; border: 1.5px solid var(--muted); }
.tdot.main { background: var(--accent); border-color: var(--accent); }

.flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.flag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

.flag.bad { background: var(--bad-soft); color: var(--bad); }
.flag.good { background: var(--good-soft); color: var(--good); }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.list li { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 13.5px; padding: 9px 0; border-bottom: 1px solid var(--line); }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }

/* Comps */
.comps { display: grid; gap: 18px; }
.comp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); display: grid; min-width: 0; overflow: hidden; }

.comp-head > div { display: grid; gap: 6px; min-width: 0; }
.comp-head h3 { font-size: 22px; font-weight: 700; overflow-wrap: anywhere; }
.arch { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.picks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border-block: 1px solid var(--line); }
.pick { padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; background: var(--surface); }

.dmg.P { color: var(--ad); } .dmg.M { color: var(--ap); } .dmg.X { color: var(--muted); }

.pf.warn { color: var(--warn); } .pf.bad { color: var(--bad); } .pf.good { color: var(--good); }
.comp-body { padding: 16px 18px 18px; display: grid; gap: 16px; }
.profile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; }
.dbar { height: 8px; border-radius: 999px; overflow: hidden; display: flex; gap: 2px; background: var(--surface-3); }
.dbar span { display: block; height: 100%; border-radius: 999px; }
.dbar .ad { background: var(--ad); } .dbar .ap { background: var(--ap); }
.dlegend { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.dlegend b { font-weight: 600; }
.dlegend .a { color: var(--ad); } .dlegend .p { color: var(--ap); }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.plan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.plan > div { padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); min-width: 0; }

.plan p.na { color: var(--faint); }

/* Champion portraits */
.ci { width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; overflow: hidden; background: var(--surface-3); border: 1px solid var(--line-strong); font-family: var(--font-mono); font-size: 7.5px; font-weight: 600; color: var(--muted); letter-spacing: 0; line-height: 1; vertical-align: middle; }
.ci img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.14); }
.ci.has-img { border-color: transparent; background: transparent; }
.ci.lg { width: 48px; height: 48px; border-radius: 12px; font-size: 13px; box-shadow: 0 0 0 1px var(--line-strong); }
.ci.md { width: 22px; height: 22px; font-size: 8.5px; }
.chip.learning .ci img { opacity: .55; filter: grayscale(.4); }
.chip:has(.ci) { padding-left: 3px; }
.champ-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.champ-row .champ { min-width: 0; }

/* Sheet (editor drawer) */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; justify-content: flex-end; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.sheet { width: min(660px, 100%); height: 100%; background: var(--surface); border-left: 1px solid var(--line-strong); display: grid; grid-template-rows: auto 1fr auto; box-shadow: -24px 0 60px -20px rgba(0,0,0,.5); border-radius: var(--r-lg) 0 0 var(--r-lg); overflow: hidden; }
.sheet-head { padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 14px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.sheet-foot { padding: 14px max(22px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) 22px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); }
.sheet-foot .right { display: flex; gap: 8px; margin-left: auto; }
fieldset { border: 1px solid var(--line); border-radius: var(--r); margin: 0; padding: 14px 16px 16px; display: grid; gap: 12px; min-width: 0; background: var(--surface-2); }
legend { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); padding: 0 6px; margin-left: -6px; }
.f { display: grid; gap: 5px; min-width: 0; }
.f > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea, .crow input, .crow select, .prow input, .prow select { width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; padding: 9px 11px; transition: border-color .15s, box-shadow .15s; }
.f input::placeholder, .f textarea::placeholder, .crow input::placeholder, .prow input::placeholder { color: var(--faint); }
.f textarea { resize: vertical; min-height: 76px; }
.f input:focus, .f select:focus, .f textarea:focus, .crow input:focus, .crow select:focus, .prow input:focus, .prow select:focus { outline: none; border-color: var(--hex); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hex) 22%, transparent); }
.frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 9px; padding: 6px 10px; cursor: pointer; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; transition: border-color .15s, background .15s; }
.checks label:has(input:checked) { border-color: var(--accent-line); background: var(--accent-soft); color: var(--fg); }
.checks input { accent-color: var(--accent); margin: 0; }
.crow { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.crows { display: grid; gap: 6px; }
.crows:empty { display: none; }
.prow { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; align-items: center; }
.prow .sugs { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.prow .sugs:empty { display: none; }
.prow .sugs .chip { font-size: 11.5px; padding: 2px 8px; }
.prow-wrap { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.prow-wrap:last-child { border-bottom: 0; padding-bottom: 0; }
.quick { display: flex; flex-wrap: wrap; gap: 5px; }
.quick .chip { font-size: 11.5px; padding: 3px 9px; color: var(--muted); }
.quick .chip:hover { color: var(--fg); }
.formhint { font-size: 12.5px; color: var(--muted); margin: 0; }
.confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 10px; background: var(--surface-3); color: var(--fg); border: 1px solid var(--line-strong); padding: 10px 16px 10px 12px; border-radius: 12px; font-size: 13.5px; font-weight: 500; z-index: 80; max-width: calc(100% - 32px); box-shadow: var(--shadow-lift); }
.toast svg { color: var(--good); }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .toast:not([hidden]) { animation: toastin .28s var(--ease); }
  @keyframes toastin { from { transform: translate(-50%, 12px); opacity: 0; } }
  .scrim { animation: fadein .2s ease-out; }
  .sheet { animation: slidein .32s var(--ease); }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes slidein { from { transform: translateX(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  #view:not(.settled) > * { animation: rise .35s var(--ease) both; }
  @keyframes rise { from { transform: translateY(6px); } }
}


/* Tabs with six views */
@media (max-width: 640px) { .tabs a { flex: 0 0 auto !important; padding: 7px 11px; } }

/* Schedule */
.weekbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.weeknav { display: flex; align-items: center; gap: 6px; }
.weeklabel { display: grid; min-width: 150px; text-align: center; line-height: 1.25; }
.weeklabel b { font-family: var(--font-display); font-size: 15px; }
.weeklabel span { font-size: 12px; color: var(--muted); }
.av-dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; border: 1px solid var(--line-strong); background: var(--surface-2); }
.av-dot.yes { background: var(--good); border-color: var(--good); }
.av-dot.no { background: var(--bad); border-color: var(--bad); }
.avail-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); margin: 0; padding: 0; }
table.avail { width: 100%; min-width: 720px; border-collapse: separate; border-spacing: 0; table-layout: fixed; }

table.avail thead th { vertical-align: top; padding: 12px 6px 10px; position: relative; }
table.avail th.corner, table.avail tbody th, table.avail tfoot th { text-align: left; padding-left: 14px; width: 168px; font-size: 13px; font-weight: 600; color: var(--muted); }
table.avail thead th.corner { vertical-align: bottom; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
table.avail tbody th { color: var(--fg); }
table.avail tr.first-sub > * { border-top: 1px dashed var(--line-strong); }
table.avail tfoot > tr > * { border-bottom: 0; padding-block: 10px 12px; }

table.avail .today::after { content: ""; position: absolute; left: 20%; right: 20%; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--accent); }
.dh { display: grid; gap: 0; line-height: 1.2; }
.dn { font-family: var(--font-display); font-weight: 700; font-size: 14px; }

/* ---------- State ---------- */
const COLS = ["players", "comps", "scrims", "avail", "fearless", "scouting"];
const VIEWS = ["roster", "team", "comps", "schedule", "fearless", "scouting"];
const S = { scrims: [], avail: [], fearless: [], scouting: [], weekOffset: 0, scoutDraft: null, roleFilter: "all", mode: "loading", players: [], comps: [], meta: {}, loaded: { players: false, comps: false }, readOnly: false, stale: false, view: "roster", error: "" };
let db = null;
const LS_KEY = "five-stack-board-v1";

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function champInfo(name) { return name ? CHAMPS.get(String(name).trim().toLowerCase()) : null; }
function champName(name) { const c = champInfo(name); return c ? c.name : String(name || "").trim(); }
let ICONS = {};
function initials(name) { const w = String(name || "").split(/[^A-Za-z0-9]+/).filter(Boolean); if (!w.length) return "?"; return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase(); }
function champIcon(name, size) {
  const n = champName(name); if (!n) return "";
  const src = ICONS[n.toLowerCase()];
  const cls = "ci" + (size ? " " + size : "") + (src ? " has-img" : "");
  return src ? `<span class="${cls}"><img src="${esc(src)}" alt="" loading="lazy"></span>` : `<span class="${cls}" aria-hidden="true">${esc(initials(n))}</span>`;
}
function playerById(id) { return S.players.find(p => p.id === id); }
function roleIdx(k) { const i = ROLES.findIndex(r => r.k === k); return i < 0 ? 9 : i; }
function sortedPlayers() { return [...S.players].sort((a, b) => roleIdx(a.primaryRole) - roleIdx(b.primaryRole) || String(a.name).localeCompare(b.name)); }
function rankText(p) { if (!p.rank || p.rank === "Unranked") return p.rank ? "Unranked" : ""; return ["Master", "Grandmaster", "Challenger"].includes(p.rank) || !p.div ? p.rank : p.rank + " " + p.div; }
function lines(s) { return String(s || "").split("\n").map(x => x.trim()).filter(Boolean); }

let toastTimer;
function toast(msg) { const t = document.getElementById("toast"); t.hidden = true; t.innerHTML = I.check + `<span>${esc(msg)}</span>`; void t.offsetWidth; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); }

/* ---------- Storage ---------- */
function localLoad() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function localPersist() { try { const o = { meta: S.meta }; COLS.forEach(c => { o[c] = S[c]; }); localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) {} }

function startLocal() {
  const d = localLoad() || exampleBoard();
  S.mode = "local"; COLS.forEach(c => { S[c] = d[c] || []; }); S.meta = d.meta || {};
  S.loaded = { players: true, comps: true };
  render();
}

function startDb() {
  S.mode = "db";
  const timer = setTimeout(() => { S.stale = true; render(); }, 10000);
  const done = () => { if (S.loaded.players && S.loaded.comps) { clearTimeout(timer); S.stale = false; } };
  const onErr = (e) => { clearTimeout(timer); S.error = "The team data can't be reached right now. Reopen the page to try again."; S.loaded.players = S.loaded.comps = true; render(); };
  COLS.forEach(col => db.collection(col).onSnapshot(snap => {
    S[col] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    if (col in S.loaded && (!snap.metadata.fromCache || snap.size)) S.loaded[col] = true;
    done(); render();
  }, col in S.loaded ? onErr : () => {}));
  db.doc("team/meta").onSnapshot(snap => { S.meta = snap.exists ? { ...snap.data() } : {}; renderHeader(); }, () => {});
}

/* ---------- Vercel API mode ---------- */
const API = "/api/board";
const CODE_KEY = "five-stack-board-team-code";
let apiVersion = null, pollTimer = null;
function getCode() { try { return localStorage.getItem(CODE_KEY) || ""; } catch (e) { return S.code || ""; } }
function setCode(c) { S.code = c; try { if (c) localStorage.setItem(CODE_KEY, c); else localStorage.removeItem(CODE_KEY); } catch (e) {} }

async function apiFetch(force) {
  const r = await fetch(API + (apiVersion != null && !force ? `?since=${apiVersion}` : ""), { cache: "no-store" });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (r.status === 503 && j && j.error) { S.error = j.error; render(); return; }
  if (!r.ok || !j) throw new Error("HTTP " + r.status);
  if (j.unchanged) return;
  apiVersion = j.version; COLS.forEach(c => { S[c] = j[c] || []; }); S.meta = j.meta || {};
  S.loaded = { players: true, comps: true }; S.stale = false; S.error = "";
  render();
}
async function poll(force) {
  clearTimeout(pollTimer);
  try { await apiFetch(force); if (S.stale) { S.stale = false; render(); } }
  catch (e) { S.stale = true; render(); }
  if (!document.hidden && !S.error) pollTimer = setTimeout(poll, 5000);
}
function startApi() {
  S.mode = "api"; S.readOnly = !getCode();
  render(); poll(true);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
}
async function apiWrite(body) {
  const code = getCode();
  if (!code) { S.readOnly = true; render(); toast("Enter the team code to make changes."); return false; }
  let r;
  try { r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "x-team-code": code }, body: JSON.stringify(body) }); }
  catch (e) { toast("Couldn't save. Check your connection and try again."); poll(true); return false; }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (r.status === 401) { setCode(""); S.readOnly = true; poll(true); toast("The team code has changed. Close this, then unlock editing with the new code."); return false; }
  if (!r.ok) { toast((j && j.error) || "Couldn't save. Try again in a moment."); poll(true); return false; }
  poll(true); return true;
}
function openCodeSheet() {
  openSheet("Unlock editing", `<p class="formhint">Anyone with the link can view the board. To make changes (players, comps, availability, scrims and scouting notes), enter your team's code. This device remembers it.</p>
    <label class="f"><span>Team code</span><input id="teamCode" name="tcode" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required placeholder="Ask your captain"></label>`, {
    onSubmit: async (f) => {
      const code = f.tcode.value.trim();
      if (!code) { toast("Enter the team code first."); return false; }
      let r; try { r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "x-team-code": code }, body: JSON.stringify({ action: "verify" }) }); }
      catch (e) { toast("Couldn't check the code. Check your connection and try again."); return false; }
      if (r.status === 401) { toast("That team code isn't right."); f.tcode.select(); return false; }
      if (!r.ok) { let j = null; try { j = await r.json(); } catch (e) {} toast((j && j.error) || "Couldn't check the code. Try again in a moment."); return false; }
      setCode(code); S.readOnly = false; render(); toast("Editing unlocked"); return true;
    },
  });
  const b = document.getElementById("saveBtn"); if (b) b.textContent = "Unlock";
}

function handleWriteError(e) {
  const code = e && e.code;
  if (code === "invalid_argument") { S.readOnly = true; render(); toast("You have view-only access, so changes can't be saved."); }
  else if (code === "quota_exceeded") toast("The board is full. Delete some players or comps, then try again.");
  else if (code === "resource_exhausted") toast("Too many saves at once. Wait a moment, then save again.");
  else toast("Couldn't save. Check your connection and try again.");
}

async function writeDoc(col, id, data) {
  const clean = JSON.parse(JSON.stringify(data)); delete clean.id;
  clean.updatedAt = new Date().toISOString();
  if (S.mode === "db") {
    try { await db.collection(col).doc(id).set(clean); return true; }
    catch (e) { if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); try { await db.collection(col).doc(id).set(clean); return true; } catch (e2) { handleWriteError(e2); return false; } } handleWriteError(e); return false; }
  }
  const list = S[col];
  const i = list.findIndex(x => x.id === id); const row = { ...clean, id };
  if (i >= 0) list[i] = row; else list.push(row);
  if (S.mode === "api") { render(); const ok = await apiWrite({ action: "set", col, id, data: clean }); if (!ok) render(); return ok; } // optimistic; a failed save re-syncs from the server
  localPersist(); render(); return true;
}
async function deleteDoc(col, id) {
  if (S.mode === "db") { try { await db.collection(col).doc(id).delete(); return true; } catch (e) { handleWriteError(e); return false; } }
  S[col] = S[col].filter(x => x.id !== id);
  if (S.mode === "api") { render(); const ok = await apiWrite({ action: "delete", col, id }); if (!ok) render(); return ok; }
  localPersist(); render(); return true;
}
async function saveMeta(meta) {
  S.meta = { ...S.meta, ...meta };
  if (S.mode === "db") { try { await db.doc("team/meta").set(S.meta); } catch (e) { handleWriteError(e); } }
  else if (S.mode === "api") { if (!(await apiWrite({ action: "meta", data: { teamName: S.meta.teamName } }))) return false; }
  else localPersist();
  renderHeader();
}
// Several writes at once: one request in API mode (chunks of 100), one by one elsewhere
async function writeMany(ops) {
  if (S.mode !== "api") {
    for (const o of ops) { const ok = o.action === "delete" ? await deleteDoc(o.col, o.id) : await writeDoc(o.col, o.id, o.data); if (!ok) return false; }
    return true;
  }
  const stamp = new Date().toISOString();
  ops = ops.map(o => o.action === "delete" ? o : { ...o, data: { ...JSON.parse(JSON.stringify(o.data)), updatedAt: stamp } });
  ops.forEach(o => { delete (o.data || {}).id; if (o.action === "delete") S[o.col] = S[o.col].filter(x => x.id !== o.id); else { const l = S[o.col]; const i = l.findIndex(x => x.id === o.id); const row = { ...o.data, id: o.id }; if (i >= 0) l[i] = row; else l.push(row); } });
  render();
  for (let i = 0; i < ops.length; i += 100) { if (!(await apiWrite({ action: "batch", ops: ops.slice(i, i + 100) }))) return false; }
  return true;
}
async function loadExamples() {
  const ex = exampleBoard();
  const ops = [];
  for (const c of COLS) for (const row of ex[c]) {
    if ((c === "scouting" || c === "fearless") && S[c].some(x => x.id === row.id)) continue; // never overwrite real notes or a live series
    ops.push({ action: "set", col: c, id: row.id, data: row });
  }
  if (await writeMany(ops)) toast("Example team loaded");
}
async function clearExamples() {
  const ops = [];
  COLS.forEach(c => S[c].filter(x => x.example).forEach(x => ops.push({ action: "delete", col: c, id: x.id })));
  if (await writeMany(ops)) toast("Examples cleared");
}

/* ---------- Analysis ---------- */
function poolHas(p, champ) { const n = champName(champ).toLowerCase(); return (p.champions || []).find(c => champName(c.champ).toLowerCase() === n); }

function compStats(comp) {
  let ad = 0, ap = 0, front = 0, known = 0, filled = 0;
  const flags = [];
  const perPick = {};
  for (const r of ROLES) {
    const pk = (comp.picks || {})[r.k] || {};
    const info = champInfo(pk.champ);
    const out = { info, note: null };
    if (pk.champ) filled++;
    if (info) { known++; if (info.d === "P") ad += 1; else if (info.d === "M") ap += 1; else { ad += .5; ap += .5; } if (info.t) front++; }
    const pl = pk.playerId ? playerById(pk.playerId) : null;
    if (pk.champ && pl) {
      const entry = poolHas(pl, pk.champ);
      if (!entry) out.note = { cls: "bad", text: `Not in ${pl.name}'s pool` };
      else if (entry.tier === "learning") out.note = { cls: "warn", text: `${pl.name} is still learning this` };
      else if (entry.tier === "pocket") out.note = { cls: "warn", text: "Pocket pick" };
      else out.note = { cls: "good", text: TIER[entry.tier]?.name + " pick" };
      if (pl.primaryRole !== r.k && !(pl.secondaryRoles || []).includes(r.k)) flags.push({ cls: "warn", text: `${pl.name} is off-role at ${r.code}` });
    } else if (pk.champ && !pk.playerId) out.note = { cls: "warn", text: "No player assigned" };
    const lk = lockedEntry(pk.champ);
    if (lk) { out.note = { cls: "bad", text: `Used in game ${lk.game} (fearless)` }; flags.push({ cls: "bad", text: `${champName(pk.champ)} is locked by fearless draft` }); }
    perPick[r.k] = out;
  }
  const ids = ROLES.map(r => ((comp.picks || {})[r.k] || {}).playerId).filter(Boolean);
  const dup = ids.filter((id, i) => ids.indexOf(id) !== i);
  [...new Set(dup)].forEach(id => { const p = playerById(id); if (p) flags.push({ cls: "bad", text: `${p.name} is assigned twice` }); });
  const total = ad + ap;
  if (known >= 4) {
    if (ap / total < 0.25) flags.push({ cls: "warn", text: "Almost all AD: easy for them to stack armor" });
    else if (ad / total < 0.25) flags.push({ cls: "warn", text: "Almost all AP: easy for them to stack magic resist" });
    if (front === 0) flags.push({ cls: "bad", text: "No frontline" });
  }
  if (filled < 5) flags.push({ cls: "warn", text: `${5 - filled} pick${5 - filled === 1 ? "" : "s"} open` });
  const pickIssues = Object.values(perPick).some(x => x.note && x.note.cls !== "good");
  if (!flags.length && !pickIssues && filled === 5) flags.push({ cls: "good", text: "Balanced damage, everyone on a practised pick" });
  return { ad, ap, total, front, perPick, flags };
}

/* ---------- Rendering ---------- */
function renderHeader() {
  document.getElementById("teamName").textContent = S.meta.teamName || "Our Team";
  document.getElementById("renameBtn").hidden = S.readOnly;
  const st = document.getElementById("status"), tx = document.getElementById("statusText");
  st.className = "status";
  if (S.mode === "loading") tx.textContent = "Connecting…";
  else if (S.mode === "local") { st.classList.add("local"); tx.textContent = "Saved in this browser only"; }
  else if (S.mode === "api") { if (S.stale) { st.classList.add("local"); tx.textContent = "Reconnecting…"; } else if (S.readOnly) { st.classList.add("ro"); tx.textContent = "View only"; } else tx.textContent = "Live with your team"; }
  else if (S.readOnly) { st.classList.add("ro"); tx.textContent = "View only"; }
  else tx.textContent = S.stale ? "Can't reach the board yet; showing what's loaded" : "Shared live with everyone on this page";
  const cb = document.getElementById("codeBtn");
  cb.hidden = S.mode !== "api" || !!S.error;
  if (S.mode === "api") {
    if (S.readOnly) { cb.className = "btn small primary"; cb.innerHTML = I.key + "<span>Unlock editing</span>"; cb.removeAttribute("aria-label"); cb.title = ""; }
    else { cb.className = "iconbtn"; cb.innerHTML = I.lock; cb.setAttribute("aria-label", "Lock editing on this device"); cb.title = "Lock editing on this device"; }
  }
  document.getElementById("nPlayers").textContent = S.players.length ? S.players.length : "";
  document.getElementById("nComps").textContent = S.comps.length ? S.comps.length : "";
  const up = upcomingScrims().length; document.getElementById("nScrims").textContent = up || "";
  const sr = series(); document.getElementById("nLocked").textContent = sr.enabled && sr.locked.length ? sr.locked.length : "";
  document.querySelectorAll(".tabs a").forEach(a => { if (a.dataset.view === S.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}

function render() {
  renderHeader();
  const v = document.getElementById("view");
  const ready = S.loaded.players && S.loaded.comps;
  if (S.error) { v.innerHTML = `<div class="banner warn">${esc(S.error)}</div>`; return; }
  if (!ready) { v.innerHTML = `<div class="skel" aria-busy="true"><span class="skel-note">${S.stale ? "The team data can't be reached yet. It will appear here as soon as it loads." : "Loading your roster and draft comps…"}</span><div class="line">${'<div class="sk slot-sk"></div>'.repeat(5)}</div><div class="grid">${'<div class="sk card-sk"></div>'.repeat(3)}</div></div>`; return; }
  const hasEx = COLS.some(c => S[c].some(x => x.example));
  // Don't replace the view while someone is typing in it; render again once they leave the field
  const ae = document.activeElement;
  if (ae && v.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && v.dataset.shown === S.view) { S.pendingRender = true; return; }
  S.pendingRender = false;
  const exBanner = hasEx && !S.readOnly ? `<div class="banner"><span>${I.info}<span>You're looking at an <b>example team</b>. Add your own teammates, then clear the examples.</span></span><button class="btn small" data-act="clear-ex" type="button">Clear examples</button></div>` : "";
  let body = "";
  if (S.view === "team") body = viewTeam(); else if (S.view === "comps") body = viewComps(); else if (S.view === "schedule") body = viewSchedule(); else if (S.view === "fearless") body = viewFearless(); else if (S.view === "scouting") body = viewScouting(); else body = viewRoster();
  v.innerHTML = exBanner + body;
  if (v.dataset.shown === S.view) v.classList.add("settled"); else { v.classList.remove("settled"); v.dataset.shown = S.view; }
}

function viewEmptyRoster() {
  return `<div class="empty"><span class="ico">${I.users}</span><h3>No teammates yet</h3><p>Add each player with their roles, champion pool, and what they're good and bad at. Everything you add here is shared with everyone who opens this page.</p>
  ${S.readOnly ? (S.mode === "api" ? `<div class="row"><button class="btn primary" data-act="unlock" type="button">${I.key}Unlock editing</button></div>` : "") : `<div class="row"><button class="btn primary" data-act="add-player" type="button">${I.plus}Add a teammate</button><button class="btn" data-act="load-ex" type="button">Load an example team</button></div>`}</div>`;
}

function lineupStrip() {
  const ps = S.players;
  return `<div class="lineup">${ROLES.map(r => {
    const mains = ps.filter(p => p.primaryRole === r.k && !p.sub);
    const subs = ps.filter(p => !mains.includes(p) && (p.primaryRole === r.k || (p.secondaryRoles || []).includes(r.k)));
    if (!mains.length) return `<div class="slot open"><div class="slot-top"><span class="role">${ri(r.k)}${r.code}</span><span class="state bad" title="No main"></span></div><div class="who">Open</div><div class="meta">${subs.length ? "Can fill: " + esc(subs.map(s => s.name).join(", ")) : "Nobody plays this yet"}</div></div>`;
    return `<div class="slot"><div class="slot-top"><span class="role">${ri(r.k)}${r.code}</span><span class="state${subs.length ? "" : " warn"}" title="${subs.length ? "Covered with backup" : "No backup"}"></span></div><div class="who">${esc(mains.map(m => m.name).join(" / "))}</div><div class="meta">${subs.length ? "Backup: " + esc(subs.map(s => s.name).join(", ")) : "No backup"}</div></div>`;
  }).join("")}</div>`;
}

function viewRoster() {
  const top = `<div class="toolbar"><div><h2>Roster</h2><p>Who plays what, how deep their pools go, and where they need cover.</p></div>${S.readOnly ? "" : `<div class="actions"><button class="btn primary" data-act="add-player" type="button">${I.plus}Add teammate</button></div>`}</div>`;
  if (!S.players.length) return top + viewEmptyRoster();
  const f = S.roleFilter;
  const plays = (p, k) => p.primaryRole === k || (p.secondaryRoles || []).includes(k);
  const shown = sortedPlayers().filter(p => f === "all" || plays(p, f));
  const filters = `<div class="filters" role="group" aria-label="Filter by role"><button class="fchip" type="button" data-act="filter" data-val="all" aria-pressed="${f === "all"}">All <span class="c">${S.players.length}</span></button>${ROLES.map(r => `<button class="fchip" type="button" data-act="filter" data-val="${r.k}" aria-pressed="${f === r.k}">${ri(r.k)}${r.code} <span class="c">${S.players.filter(p => plays(p, r.k)).length}</span></button>`).join("")}</div>`;
  return top + lineupStrip() + filters + (shown.length ? `<div class="grid">${shown.map(playerCard).join("")}</div>` : `<div class="empty"><h3>Nobody plays ${esc(ROLE[f]?.name || "this role")}</h3><p>No teammate has this as a main or backup role yet.</p></div>`);
}

function playerCard(p) {
  const r = ROLE[p.primaryRole];
  const secs = (p.secondaryRoles || []).filter(k => k !== p.primaryRole).map(k => ROLE[k]?.code).filter(Boolean);
  const pool = TIERS.map(t => {
    const cs = (p.champions || []).filter(c => (c.tier || "comfort") === t.k);
    if (!cs.length) return "";
    return `<div class="tier-row"><span class="label">${t.name}</span><div class="chips">${cs.map(c => `<span class="chip ${t.k}${lockedEntry(c.champ) ? " locked" : ""}"${lockedEntry(c.champ) ? ` title="Locked by fearless draft in game ${lockedEntry(c.champ).game}"` : ""}>${champIcon(c.champ)}${esc(champName(c.champ))}${c.role && c.role !== p.primaryRole && ROLE[c.role] ? `<small>${ROLE[c.role].code}</small>` : ""}</span>`).join("")}</div></div>`;
  }).join("");
  const li = (arr) => arr && arr.length ? arr.map(x => `<li>${esc(x)}</li>`).join("") : `<li class="none">None added</li>`;
  const rk = rankText(p);
  return `<article class="card">
    <div class="card-head">
      <span class="role big">${r ? ri(r.k) + r.code : "—"}</span>
      <div><h3>${esc(p.name || "Unnamed")}${p.ign ? `<span class="ign">${esc(p.ign)}</span>` : ""}${p.example ? `<span class="tag-ex">Example</span>` : ""}</h3>
        <div class="pills">${p.sub ? `<span class="pill sub">Sub</span>` : ""}${rk ? `<span class="pill rank" data-rk="${esc(String(p.rank || "").toLowerCase())}">${esc(rk)}</span>` : ""}${p.style ? `<span class="pill">${esc(p.style)}</span>` : ""}${secs.length ? `<span class="pill">Also ${secs.join(", ")}</span>` : ""}</div>
      </div>
      ${S.readOnly ? "" : `<button class="iconbtn" data-act="edit-player" data-id="${esc(p.id)}" type="button" aria-label="Edit ${esc(p.name)}" title="Edit">${I.edit}</button>`}
    </div>
    <div class="pool">${pool || `<span class="formhint">No champions added yet.</span>`}</div>
    <div class="sw"><div><span class="label">Strengths</span><ul class="plus">${li(p.strengths)}</ul></div><div><span class="label">Weaknesses</span><ul class="minus">${li(p.weaknesses)}</ul></div></div>
    ${p.notes ? `<p class="notes">${I.note}<span>${esc(p.notes)}</span></p>` : ""}
  </article>`;
}

function viewTeam() {
  const top = `<div class="toolbar"><div><h2>Team map</h2><p>Role coverage, champion depth per lane, and the patterns across the whole team.</p></div></div>`;
  if (!S.players.length) return top + viewEmptyRoster();
  const ps = sortedPlayers();
  // Coverage table
  const rows = ps.map(p => `<tr><td>${esc(p.name)}</td>${ROLES.map(r => {
    const n = (p.champions || []).filter(c => c.role === r.k && c.tier !== "learning").length;
    if (p.primaryRole === r.k) return `<td><span class="cell main">MAIN · ${n}</span></td>`;
    if ((p.secondaryRoles || []).includes(r.k)) return `<td><span class="cell sec">SEC · ${n}</span></td>`;
    if (n) return `<td><span class="cell pool">${n} champ${n > 1 ? "s" : ""}</span></td>`;
    return `<td><span class="cell none">—</span></td>`;
  }).join("")}</tr>`).join("");
  const foot = `<tr><td>Cover</td>${ROLES.map(r => {
    const m = ps.filter(p => p.primaryRole === r.k).length, s = ps.filter(p => (p.secondaryRoles || []).includes(r.k) && p.primaryRole !== r.k).length;
    return `<td>${m ? "" : `<span class="flag bad">No main</span>`}${m && !s ? `<span class="flag warn">No backup</span>` : ""}${m && s ? `<span class="flag good">${m}+${s}</span>` : ""}</td>`;
  }).join("")}</tr>`;
  const coverage = `<section class="panel"><h3>Role coverage</h3><p class="hint">Number = draft-ready champions (main, comfort, or pocket) each player has for that role.</p>
    <div class="scroll"><table class="cov"><thead><tr><th>Player</th>${ROLES.map(r => `<th>${ri(r.k)}${r.code}</th>`).join("")}</tr></thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div></section>`;

  // Depth
  const depth = ROLES.map(r => {
    const items = [];
    ps.forEach(p => (p.champions || []).forEach(c => { if (c.role === r.k) items.push({ c, p }); }));
    const order = { main: 0, comfort: 1, pocket: 2, learning: 3 };
    items.sort((a, b) => (order[a.c.tier] ?? 1) - (order[b.c.tier] ?? 1) || champName(a.c.champ).localeCompare(champName(b.c.champ)));
    const ready = items.filter(i => i.c.tier === "main" || i.c.tier === "comfort").length;
    const flag = ready < 3 ? `<span class="flag ${ready === 0 ? "bad" : "warn"}">${ready === 0 ? "No reliable picks" : "Thin: easy to ban out"}</span>` : "";
    return `<div class="depth-col"><header><span class="role">${ri(r.k)}${r.code}</span><span class="count">${ready} ready</span></header>${flag}
      ${items.length ? items.map(i => `<div class="depth-item"><span><i class="tdot ${esc(i.c.tier)}"></i>${champIcon(i.c.champ, "md")}<span style="overflow:hidden;text-overflow:ellipsis;min-width:0">${esc(champName(i.c.champ))}</span></span><span class="by">${esc(i.p.name)}</span></div>`).join("") : `<span class="formhint">No champions</span>`}</div>`;
  }).join("");
  const depthPanel = `<section class="panel"><h3>Champion depth by role</h3><p class="hint">A role with fewer than three main or comfort picks can be banned out in draft.</p>
    <div class="legend"><span><i class="tdot main"></i>Main</span><span><i class="tdot"></i>Comfort</span><span><i class="tdot pocket"></i>Pocket</span><span><i class="tdot learning"></i>Learning</span></div>
    <div class="depth">${depth}</div></section>`;

  // Shared champions
  const byChamp = new Map();
  ps.forEach(p => (p.champions || []).forEach(c => { const n = champName(c.champ); if (!n) return; const k = n.toLowerCase(); if (!byChamp.has(k)) byChamp.set(k, { name: n, entries: [] }); if (!byChamp.get(k).entries.some(e => e.p.id === p.id)) byChamp.get(k).entries.push({ p, c }); }));
  const shared = [...byChamp.values()].filter(x => x.entries.length > 1);
  const sharedPanel = `<section class="panel"><h3>Shared champions</h3><p class="hint">Champions in more than one pool. Across roles they're flex picks that hide your draft; in the same role, agree on who gets them.</p>
    ${shared.length ? `<ul class="list">${shared.map(x => { const roles = new Set(x.entries.map(e => e.c.role)); return `<li><span class="champ-row" style="gap:7px">${champIcon(x.name, "md")}<span><b>${esc(x.name)}</b> · ${esc(x.entries.map(e => `${e.p.name} (${ROLE[e.c.role]?.code || "?"})`).join(", "))}</span></span><span class="flag ${roles.size > 1 ? "good" : "warn"}">${roles.size > 1 ? "Flex pick" : "Same role"}</span></li>`; }).join("")}</ul>` : `<span class="formhint">No overlapping champions yet.</span>`}</section>`;

  // Damage spread of mains
  let ad = 0, ap = 0, fr = 0, cnt = 0;
  ps.forEach(p => (p.champions || []).forEach(c => { if (c.tier !== "main" && c.tier !== "comfort") return; const i = champInfo(c.champ); if (!i) return; cnt++; if (i.d === "P") ad++; else if (i.d === "M") ap++; else { ad += .5; ap += .5; } if (i.t) fr++; }));
  const tot = ad + ap || 1;
  const dmgPanel = `<section class="panel"><h3>Damage across reliable picks</h3><p class="hint">Main and comfort champions only. A lopsided team is easier to itemize against.</p>
    <div class="profile"><div class="dbar"><span class="ad" style="width:${(ad / tot * 100).toFixed(1)}%"></span><span class="ap" style="width:${(ap / tot * 100).toFixed(1)}%"></span></div><span class="dlegend">${cnt} champs</span></div>
    <div class="dlegend"><span class="a"><b>${Math.round(ad / tot * 100)}%</b> AD</span><span class="p"><b>${Math.round(ap / tot * 100)}%</b> AP</span><span><b>${fr}</b> frontline options</span></div></section>`;

  // Tags
  const tally = (key) => { const m = new Map(); ps.forEach(p => (p[key] || []).forEach(t => { const k = t.toLowerCase(); if (!m.has(k)) m.set(k, { t, who: [] }); m.get(k).who.push(p.name); })); return [...m.values()].sort((a, b) => b.who.length - a.who.length || a.t.localeCompare(b.t)); };
  const tagList = (arr) => arr.length ? `<ul class="list">${arr.map(x => `<li><span>${esc(x.t)}</span><span class="count">${esc(x.who.join(", "))}</span></li>`).join("")}</ul>` : `<span class="formhint">Nothing added yet.</span>`;
  const tagsPanel = `<div class="two"><section class="panel"><h3>Team strengths</h3>${tagList(tally("strengths"))}</section><section class="panel"><h3>Weaknesses to cover</h3>${tagList(tally("weaknesses"))}</section></div>`;

  return top + coverage + depthPanel + `<div class="two">${sharedPanel}${dmgPanel}</div>` + tagsPanel;
}

function viewComps() {
  const top = `<div class="toolbar"><div><h2>Draft comps</h2><p>Plan full five-player drafts. Each pick is checked against that player's pool, and the comp gets a damage and frontline read.</p></div>${S.readOnly ? "" : `<div class="actions"><button class="btn primary" data-act="add-comp" type="button">${I.plus}New comp</button></div>`}</div>`;

  const sorted = [...S.comps].sort((a, b) => String(a.name).localeCompare(b.name));

function compCard(c) {
  const st = compStats(c);
  const a = ARCH[c.archetype];
  const picks = ROLES.map(r => {
    const pk = (c.picks || {})[r.k] || {};
    const pl = pk.playerId ? playerById(pk.playerId) : null;
    const pp = st.perPick[r.k];
    return `<div class="pick"><span class="role">${ri(r.k)}${r.code}</span>
      <div class="champ-row">${pk.champ ? champIcon(pk.champ, "lg") : ""}<div class="champ ${pk.champ ? "" : "empty-pick"}">${pk.champ ? esc(champName(pk.champ)) : "Open"}</div></div>
      <div class="player">${pl ? esc(pl.name) : (pk.playerId ? "Removed player" : "No player")}</div>
      ${pp.info ? `<span class="dmg ${pp.info.d}">${DMG_LABEL[pp.info.d]}${pp.info.t ? " · FRONTLINE" : ""}</span>` : ""}
      ${pp.note ? `<span class="pf ${pp.note.cls}">${esc(pp.note.text)}</span>` : ""}</div>`;

      ${S.readOnly ? "" : `<button class="btn small" data-act="edit-comp" data-id="${esc(c.id)}" type="button">${I.edit}Edit</button>`}</div>
    <div class="picks">${picks}</div>
    <div class="comp-body">
      <div class="profile"><div class="dbar" role="img" aria-label="Damage split ${Math.round(st.ad / tot * 100)}% AD, ${Math.round(st.ap / tot * 100)}% AP"><span class="ad" style="width:${(st.ad / tot * 100).toFixed(1)}%"></span><span class="ap" style="width:${(st.ap / tot * 100).toFixed(1)}%"></span></div>
        <div class="dlegend"><span class="a"><b>${Math.round(st.ad / tot * 100)}%</b> AD</span><span class="p"><b>${Math.round(st.ap / tot * 100)}%</b> AP</span><span><b>${st.front}</b> frontline</span></div></div>
      <div class="flags">${st.flags.map(f => `<span class="flag ${f.cls}">${esc(f.text)}</span>`).join("")}</div>
      <div class="plan">
        <div><span class="label">Win condition</span><p class="${c.winCondition ? "" : "na"}">${esc(c.winCondition || "Not written yet")}</p></div>
        <div><span class="label">Weak against</span><p class="${c.weakAgainst ? "" : "na"}">${esc(c.weakAgainst || "Not written yet")}</p></div>
        <div><span class="label">Target bans</span><p class="${c.bans ? "" : "na"}">${esc(c.bans || "None")}</p></div>
      </div>
      ${c.notes ? `<p class="notes">${esc(c.notes)}</p>` : ""}
    </div></article>`;
}

/* ---------- Dates ---------- */
const DAY_SHORT = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const READY_N = 5;
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parseYmd(s) { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function weekStart(offset) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7); return d; }
function weekDates(offset) { const s = weekStart(offset); return Array.from({ length: 7 }, (_, i) => { const d = new Date(s); d.setDate(s.getDate() + i); return d; }); }
function fmtDate(d, opts) { try { return d.toLocaleDateString(undefined, opts || { day: "numeric", month: "short" }); } catch (e) { return ymd(d); } }
function todayYmd() { return ymd(new Date()); }

/* ---------- Schedule data ---------- */
function squad() { return sortedPlayers().sort((a, b) => (a.sub ? 1 : 0) - (b.sub ? 1 : 0)); }
function availId(date, pid) { return `${date}_${pid}`; }
function availOf(pid, date) { const a = S.avail.find(x => x.id === availId(date, pid)); return a ? a.status : ""; }
function dayInfo(date) {
  const ps = S.players;
  const yes = ps.filter(p => availOf(p.id, date) === "yes");
  const no = ps.filter(p => availOf(p.id, date) === "no");
  const starters = ps.filter(p => !p.sub);
  const startersIn = starters.length >= 5 && starters.every(p => availOf(p.id, date) === "yes");
  return { yes, no, ready: yes.length >= READY_N, startersIn };
}
function scrimsOn(date) { return S.scrims.filter(x => x.date === date).sort((a, b) => String(a.time).localeCompare(String(b.time))); }
function cntText(n) { return n > READY_N ? `${READY_N}+${n - READY_N}` : `${n}/${READY_N}`; }
function upcomingScrims() { const t = todayYmd(); return S.scrims.filter(x => x.date >= t).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)); }

/* ---------- Fearless data ---------- */
function series() { const f = S.fearless.find(x => x.id === "series"); return { enabled: false, game: 1, locked: [], ...(f || {}) }; }
function lockedEntry(champ) {
  if (!champ) return null;
  const s = series(); if (!s.enabled) return null;
  const n = champName(champ).toLowerCase();
  return (s.locked || []).find(l => champName(l.champ).toLowerCase() === n) || null;
}
async function saveSeries(next) { const cur = S.fearless.find(x => x.id === "series"); const data = { ...series(), ...next }; delete data.id; if (cur && cur.example && next.example === undefined) data.example = true; return writeDoc("fearless", "series", data); }

/* ---------- Scouting data ---------- */
const SCOUT_FIELDS = ["opponent", "matchDate", "powerPicks", "weaknesses", "gameplan"];
function scoutSaved() { return S.scouting.find(x => x.id === "next") || {}; }
function scoutValues() { return { ...Object.fromEntries(SCOUT_FIELDS.map(k => [k, scoutSaved()[k] || ""])), ...(S.scoutDraft || {}) }; }
function mentionedChamps(text) {
  const t = " " + String(text || "").toLowerCase().replace(/\.(?=\s|$)/g, " ").replace(/[^a-z0-9'.& ]+/g, " ") + " ";
  const found = [];
  for (const c of CHAMPS.values()) { const n = c.name.toLowerCase(); if (t.includes(" " + n + " ") && !found.includes(c.name)) found.push(c.name); }
  return found.slice(0, 16);
}

/* ---------- Example board ---------- */
function exampleBoard() {
  const b = JSON.parse(JSON.stringify(EXAMPLE));
  const days = weekDates(0).map(ymd);
  // Who is free when: Tue and Sat reach five, Thu is one short
  const pattern = { "ex-p1": "yyyyny ", "ex-p2": "nyyyyyn", "ex-p3": "yy yyyn", "ex-p4": "ny nyy ", "ex-p5": "yyyy yy", "ex-p6": " y nyyy" };
  b.avail = [];
  Object.entries(pattern).forEach(([pid, pat]) => [...pat].forEach((ch, i) => { if (ch === "y" || ch === "n") b.avail.push({ id: availId(days[i], pid), example: true, date: days[i], playerId: pid, status: ch === "y" ? "yes" : "no" }); }));
  b.scrims = [
    { id: "ex-s1", example: true, date: days[1], time: "19:00", opponent: "Northgate Esports", format: "Bo3", notes: "Fearless draft. Lobby invite from their captain." },
    { id: "ex-s2", example: true, date: days[3], time: "20:00", opponent: "Crimson Vale Academy", format: "Bo1", notes: "" },
    { id: "ex-s3", example: true, date: days[5], time: "17:00", opponent: "Lowtide Gaming", format: "Block (3 games)", notes: "Practice protect-the-carry comp." },
  ];
  b.fearless = [{ id: "series", example: true, enabled: true, game: 2, locked: [
    { champ: "Ornn", game: 1, side: "us" }, { champ: "Vi", game: 1, side: "us" }, { champ: "Orianna", game: 1, side: "us" }, { champ: "Kai'Sa", game: 1, side: "us" }, { champ: "Rakan", game: 1, side: "us" },
    { champ: "Azir", game: 1, side: "them" }, { champ: "Lee Sin", game: 1, side: "them" }, { champ: "Jinx", game: 1, side: "them" },
  ] }];
  b.scouting = [{ id: "next", example: true, opponent: "Northgate Esports", matchDate: days[1],
    powerPicks: "Azir and Taliyah in mid: their mid player is a control mage one-trick\nLee Sin and Xin Zhao for early jungle pressure\nBan: Azir, Lee Sin, Kalista",
    weaknesses: "Bot lane gets caught without vision after 15 minutes\nTop plays weakside and rarely teleports bot\nSlow to contest the first Void Grubs",
    gameplan: "Play for early dragons around our bot lane with Vi and Rakan\nBan Azir; first-pick Orianna if it's open\nGroup mid after first tower and force the fight at second dragon" }];
  return b;
}

/* ---------- Schedule view ---------- */
function viewSchedule() {
  const top = `<div class="toolbar"><div><h2>Scrim schedule</h2><p>Everyone marks the days they can play. A day lights up as ready once ${READY_N} players are free.</p></div>${S.readOnly ? "" : `<div class="actions"><button class="btn primary" data-act="add-scrim" type="button">${I.plus}Add scrim</button></div>`}</div>`;
  if (!S.players.length) return top + `<div class="empty"><span class="ico">${I.cal}</span><h3>Add your players first</h3><p>The schedule lists everyone on the roster. Add your starters and subs on the Roster tab, then come back to mark availability.</p></div>`;
  const dates = weekDates(S.weekOffset), keys = dates.map(ymd), today = todayYmd();
  const ps = squad();
  const info = keys.map(dayInfo);
  const range = `${fmtDate(dates[0])} – ${fmtDate(dates[6], { day: "numeric", month: "short", year: "numeric" })}`;
  const readyCount = info.filter(x => x.ready).length;
  const bar = `<div class="weekbar">
    <div class="weeknav"><button class="iconbtn" type="button" data-act="week" data-val="-1" aria-label="Previous week">${I.left}</button>
      <div class="weeklabel"><b>${esc(range)}</b><span>${S.weekOffset === 0 ? "This week" : S.weekOffset === 1 ? "Next week" : S.weekOffset === -1 ? "Last week" : (S.weekOffset > 0 ? `In ${S.weekOffset} weeks` : `${-S.weekOffset} weeks ago`)}</span></div>
      <button class="iconbtn" type="button" data-act="week" data-val="1" aria-label="Next week">${I.right}</button>
      ${S.weekOffset ? `<button class="btn small" type="button" data-act="week" data-val="0">Today</button>` : ""}</div>
    <div class="legend"><span><i class="av-dot yes"></i>Available</span><span><i class="av-dot no"></i>Busy</span><span><i class="av-dot"></i>Not set</span>${readyCount ? `<span class="flag good">${readyCount} day${readyCount > 1 ? "s" : ""} ready</span>` : ""}</div></div>`;
  const hint = S.readOnly ? (S.mode === "api" ? `<p class="formhint">Unlock editing to mark your availability.</p>` : "") : `<p class="formhint">Tap a box to switch between available, busy and not set.</p>`;

  const cellBtn = (p, k, i) => {
    const st = availOf(p.id, k);
    const label = `${p.name}, ${DAY_SHORT[i]} ${fmtDate(dates[i])}: ${st === "yes" ? "available" : st === "no" ? "busy" : "not set"}`;
    return `<button class="av ${st}" type="button" data-act="avail" data-pid="${esc(p.id)}" data-date="${k}" aria-label="${esc(label)}" title="${esc(label)}"${S.readOnly ? " disabled" : ""}>${st === "yes" ? I.check : st === "no" ? I.x : ""}</button>`;
  };
  const scrimChip = (x, ready) => `<button class="scrim-chip${ready ? "" : " short"}" type="button" data-act="edit-scrim" data-id="${esc(x.id)}"${S.readOnly ? " disabled" : ""}><b>${esc(x.time || "--:--")}</b><span>${esc(x.opponent || "TBD")}</span></button>`;
  const head = keys.map((k, i) => `<th class="${info[i].ready ? "ready" : ""}${k === today ? " today" : ""}" scope="col">
      <div class="dh"><span class="dn">${DAY_SHORT[i]}</span><span class="dd">${esc(fmtDate(dates[i]))}</span></div>
      ${info[i].ready ? `<span class="ready-badge">${I.bolt}Ready for scrims</span>` : ""}
      <div class="dscrims">${scrimsOn(k).map(x => scrimChip(x, info[i].ready)).join("")}</div>
      ${S.readOnly ? "" : `<button class="add-day" type="button" data-act="add-scrim" data-date="${k}" aria-label="Add scrim on ${DAY_SHORT[i]}">${I.plus}</button>`}</th>`).join("");
  const rows = ps.map((p, pi) => `<tr class="${p.sub && (pi === 0 || !ps[pi - 1].sub) ? "first-sub" : ""}"><th scope="row"><span class="who-cell">${p.primaryRole ? `<span class="role">${ri(p.primaryRole)}${ROLE[p.primaryRole]?.code || ""}</span>` : ""}<span class="nm">${esc(p.name)}</span>${p.sub ? `<span class="pill sub">Sub</span>` : ""}</span></th>${keys.map((k, i) => `<td class="${info[i].ready ? "ready" : ""}">${cellBtn(p, k, i)}</td>`).join("")}</tr>`).join("");
  const foot = `<tr><th scope="row">Available</th>${info.map(x => `<td class="${x.ready ? "ready" : ""}"><span class="cnt ${x.ready ? "ok" : x.yes.length >= READY_N - 1 ? "near" : ""}">${cntText(x.yes.length)}</span>${x.ready && x.startersIn ? `<small>Starting five</small>` : x.ready ? `<small>With subs</small>` : ""}</td>`).join("")}</tr>`;
  const table = `<div class="scroll avail-wrap"><table class="avail"><thead><tr><th scope="col" class="corner">Player</th>${head}</tr></thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>`;

  // Phone layout: one card per day
  const cards = `<div class="daycards">${keys.map((k, i) => `<section class="daycard${info[i].ready ? " ready" : ""}${k === today ? " today" : ""}">
      <header><div><b>${DAY_SHORT[i]}</b> <span>${esc(fmtDate(dates[i]))}</span></div><div class="dc-right">${info[i].ready ? `<span class="ready-badge">${I.bolt}Ready</span>` : ""}<span class="cnt ${info[i].ready ? "ok" : info[i].yes.length >= READY_N - 1 ? "near" : ""}">${cntText(info[i].yes.length)}</span></div></header>
      ${scrimsOn(k).length || !S.readOnly ? `<div class="dscrims">${scrimsOn(k).map(x => scrimChip(x, info[i].ready)).join("")}${S.readOnly ? "" : `<button class="add-day inline" type="button" data-act="add-scrim" data-date="${k}">${I.plus}Scrim</button>`}</div>` : ""}
      <div class="dc-players">${ps.map(p => `<div class="dc-p"><span class="nm">${esc(p.name)}${p.sub ? ` <small>Sub</small>` : ""}</span>${cellBtn(p, k, i)}</div>`).join("")}</div></section>`).join("")}</div>`;

  // Upcoming list
  const up = upcomingScrims();
  const list = `<section class="panel"><h3>Upcoming scrims</h3>${up.length ? `<ul class="scrims">${up.map(x => { const d = dayInfo(x.date); const dt = parseYmd(x.date); return `<li>
      <div class="sdate"><b>${esc(fmtDate(dt, { weekday: "short" }))}</b><span>${esc(fmtDate(dt))}</span></div>
      <div class="smain"><b>${esc(x.opponent || "TBD")}</b><span>${esc([x.time, x.format].filter(Boolean).join(" · "))}${x.notes ? " · " + esc(x.notes) : ""}</span></div>
      <span class="flag ${d.ready ? "good" : d.yes.length >= READY_N - 1 ? "warn" : "bad"}">${d.ready ? (d.startersIn ? "Starting five ready" : "Ready with subs") : `${d.yes.length}/${READY_N} available`}</span>
      ${S.readOnly ? "" : `<button class="iconbtn" type="button" data-act="edit-scrim" data-id="${esc(x.id)}" aria-label="Edit scrim against ${esc(x.opponent)}">${I.edit}</button>`}</li>`; }).join("")}</ul>` : `<span class="formhint">No scrims booked yet.${S.readOnly ? "" : " Use Add scrim, or the + on a day."}</span>`}</section>`;
  return top + bar + hint + table + cards + list;
}

function editScrim(id, date) {
  const x = id ? S.scrims.find(s => s.id === id) : null;

  <fieldset><legend>Scrim</legend>
    <label class="f"><span>Opponent</span><input id="sOpp" name="opp" required value="${esc(d.opponent || "")}" placeholder="Team name"></label>
